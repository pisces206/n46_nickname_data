name: Discord Notify - Daily Traffic

on:
  schedule:
    # 22:45 JST = 13:45 UTC.
    - cron: "45 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check Traffic API authentication without sending a Discord message"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord with GitHub Traffic API views
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch traffic views
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TRAFFIC_GITHUB_TOKEN is not set. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/traffic/views?per=day" \
            -o traffic.json --write-out '%{http_code}')

          case "$HTTP_STATUS" in
            200) ;;
            401)
              echo "::error::Traffic API returned HTTP 401. Renew the PAT and update the TRAFFIC_GITHUB_TOKEN repository secret."
              exit 1 ;;
            403)
              echo "::error::Traffic API returned HTTP 403. Check PAT repository access, Administration: read, and API rate limits."
              exit 1 ;;
            *)
              echo "::error::Traffic API returned HTTP ${HTTP_STATUS}. Check repository access and GitHub API availability."
              exit 1 ;;
          esac

          jq -e '(.count | type == "number") and (.uniques | type == "number") and (.views | type == "array")' traffic.json > /dev/null
          echo "Traffic API request succeeded (HTTP 200)."

      - name: Send Discord webhook
        if: ${{ !inputs.dry_run }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set."
            exit 1
          fi

          TOTAL_VIEWS=$(jq -r '.count // 0' traffic.json)
          TOTAL_UNIQUES=$(jq -r '.uniques // 0' traffic.json)
          LATEST_TIMESTAMP=$(jq -r '.views[-1].timestamp // "unknown"' traffic.json)
          LATEST_VIEWS=$(jq -r '.views[-1].count // 0' traffic.json)
          LATEST_UNIQUES=$(jq -r '.views[-1].uniques // 0' traffic.json)

          DESCRIPTION=$(printf "直近データ:\n表示回数: %s\n訪問者数: %s\n集計日時: %s\n\n過去14日間:\n表示回数: %s\n訪問者数: %s\n\n※ GitHubリポジトリの閲覧数です。GitHub PagesのPVではありません。" "$LATEST_VIEWS" "$LATEST_UNIQUES" "$LATEST_TIMESTAMP" "$TOTAL_VIEWS" "$TOTAL_UNIQUES")

          jq -n \
            --arg title "今日のアクセス状況" \
            --arg description "$DESCRIPTION" \
            --arg url "$REPOSITORY_URL" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: 16776960
              }]
            }' > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
