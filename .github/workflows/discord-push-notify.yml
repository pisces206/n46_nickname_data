name: Discord Notify - Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord on main push
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMPARE_URL: ${{ github.event.compare }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set."
            exit 1
          fi

          SHORT_SHA="${COMMIT_SHA::7}"
          DESCRIPTION=$(printf "n46_nickname_data に変更が反映されました。\n\n更新者: %s\nブランチ: %s\nコミット: %s\nメッセージ: %s\n\nコミットURL: %s\n比較URL: %s" "$ACTOR" "$BRANCH" "$SHORT_SHA" "$HEAD_MESSAGE" "$COMMIT_URL" "$COMPARE_URL")

          jq -n \
            --arg title "サイトが更新されました" \
            --arg description "$DESCRIPTION" \
            --arg url "$COMMIT_URL" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: 5814783
              }]
            }' > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
