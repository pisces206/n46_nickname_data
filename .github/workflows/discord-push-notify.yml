name: Discord Notify - Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord on main push
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMPARE_URL: ${{ github.event.compare }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set."
            exit 1
          fi

          SHORT_SHA="${COMMIT_SHA::7}"
          DESCRIPTION=$(cat <<EOF
The main branch was updated by a push.

Repository: ${REPOSITORY}
Branch: ${BRANCH}
Actor: ${ACTOR}
Commit: [${SHORT_SHA}](${COMMIT_URL})
Compare: ${COMPARE_URL}

Message:
${HEAD_MESSAGE}
EOF
)

          jq -n \
            --arg title "GitHub Pages app updated" \
            --arg description "$DESCRIPTION" \
            --arg url "$COMMIT_URL" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: 5814783
              }]
            }' > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
