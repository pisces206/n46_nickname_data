name: Discord Notify - GitHub Pages Deploy

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord when GitHub Pages deploy completes
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Send Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          PAGE_URL: https://pisces206.github.io/n46_nickname_data
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set."
            exit 1
          fi

          DESCRIPTION=$(printf "GitHub Pages deployment completed successfully.\n\nRepository: %s\nPage URL: %s\nRun URL: %s" "$REPOSITORY" "$PAGE_URL" "$RUN_URL")

          jq -n \
            --arg title "GitHub Pages deploy completed" \
            --arg description "$DESCRIPTION" \
            --arg url "$PAGE_URL" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: 3066993
              }]
            }' > payload.json

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
